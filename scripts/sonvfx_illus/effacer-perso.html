<!doctype html>
<html><head><meta charset="utf-8">
<meta name="dz-geste" content="effacer-perso">
<meta name="dz-skill" content="style-particles">
<meta name="dz-format" content="480x270">
<meta name="dz-affiche" content="1.2">
<style>html,body{margin:0;background:#0a0a0c}canvas{display:block}</style>
</head><body><canvas id="c" width="480" height="270"></canvas>
<script>
/* t275 · Effacer un personnage (plaque propre). Fiche maison style-particles : la silhouette qui marche se défait en
   poussière lumineuse (une teinte, l'or) derrière la ligne de balayage ; le décor, lui, ne bouge pas. Elle revient en
   fondu pour boucler. */
var c=document.getElementById("c"),g=c.getContext("2d");
function cl(v){return v<0?0:v>1?1:v}
function io(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function seg(t,a,b){return cl((t-a)/(b-a))}
var GRAINS=[],s=31;
function alea(){s=(s*16807)%2147483647;return s/2147483647}
for(var i=0;i<90;i++)GRAINS.push({x:alea()*44-22,y:alea()*110-100,vx:alea()*40-10,vy:-20-alea()*50,r:1+alea()*2});
function decor(){
  g.fillStyle="#151519";g.fillRect(0,0,480,270);
  g.fillStyle="#f0b429";g.beginPath();g.arc(390,70,26,0,7);g.fill();
  g.fillStyle="#1c1c21";g.beginPath();g.moveTo(0,190);g.lineTo(160,130);g.lineTo(300,180);g.lineTo(480,120);
  g.lineTo(480,270);g.lineTo(0,270);g.fill();
  g.fillStyle="#2a2a31";g.fillRect(70,150,10,70);g.beginPath();g.arc(75,140,28,0,7);g.fill();
  g.fillStyle="#0f0f12";g.fillRect(0,220,480,50);
  g.fillStyle="#1c1c21";for(var i=0;i<12;i++)g.fillRect(i*44,238,26,4)}
function perso(x,y,t,a){
  g.globalAlpha=a;g.fillStyle="#6fa0f0";
  var p=Math.sin(t*9);
  g.beginPath();g.arc(x,y-92,13,0,7);g.fill();
  g.fillRect(x-12,y-76,24,44);
  g.save();g.translate(x-6,y-34);g.rotate(p*.35);g.fillRect(-5,0,10,34);g.restore();
  g.save();g.translate(x+6,y-34);g.rotate(-p*.35);g.fillRect(-5,0,10,34);g.restore();
  g.globalAlpha=1}
window.dzFrame=function(sec){
  var t=sec%4;
  decor();
  var x=150+t*45,y=222,bal=seg(t,.9,2.2),lb=-30+io(bal)*540;
  var retour=io(seg(t,3.3,3.95));
  if(bal<=0||retour>0){perso(x,y,t,bal<=0?1:retour)}
  else{
    g.save();g.beginPath();g.rect(lb,0,480,270);g.clip();perso(x,y,t,1);g.restore();
    if(lb>x-25){var k=seg(t,1.3,2.8);
      for(var i=0;i<GRAINS.length;i++){var q=GRAINS[i];g.fillStyle="#f0b429";g.globalAlpha=(1-k)*.9;
        g.beginPath();g.arc(x+q.x+q.vx*k*1.4,y+q.y+q.vy*k*1.4,q.r*(1-k*.5),0,7);g.fill()}
      g.globalAlpha=1}}
  if(bal>0&&bal<1){g.fillStyle="#f0b429";g.fillRect(lb-1,0,2,270);
    var h=g.createLinearGradient(lb-40,0,lb,0);h.addColorStop(0,"rgba(240,180,41,0)");h.addColorStop(1,"rgba(240,180,41,.18)");
    g.fillStyle=h;g.fillRect(lb-40,0,40,270)}
  g.fillStyle="#f0b429";g.fillRect(0,266,480*(t/4),4)};
window.dzFrame(0);
</script></body></html>
