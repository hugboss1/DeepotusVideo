<!doctype html>
<html><head><meta charset="utf-8">
<meta name="dz-geste" content="agrandir">
<meta name="dz-skill" content="style-photos">
<meta name="dz-format" content="480x270">
<meta name="dz-affiche" content="1.3">
<style>html,body{margin:0;background:#0a0a0c}canvas{display:block}</style>
</head><body><canvas id="c" width="480" height="270"></canvas>
<script>
/* t275 · Agrandir / netteté (Topaz). Fiche maison style-photos : l'image avance lentement vers son point d'intérêt. La
   petite image en gros pixels grandit (×2, les coins du cadre s'écartent), et la ligne de netteté la rend nette, du
   haut vers le bas. */
var c=document.getElementById("c"),g=c.getContext("2d");
var p=document.createElement("canvas");p.width=40;p.height=23;var gp=p.getContext("2d");
function cl(v){return v<0?0:v>1?1:v}
function io(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function seg(t,a,b){return cl((t-a)/(b-a))}
function portrait(G,x,y,w,h,t){
  G.save();G.beginPath();G.rect(x,y,w,h);G.clip();
  G.fillStyle="#2a2010";G.fillRect(x,y,w,h);
  G.fillStyle="#3a3a42";G.fillRect(x,y+h*.7,w,h*.3);
  G.fillStyle="#6fa0f0";G.beginPath();G.moveTo(x+w*.25,y+h);G.bezierCurveTo(x+w*.27,y+h*.68,x+w*.73,y+h*.68,x+w*.75,y+h);G.fill();
  G.fillStyle="#d9a066";G.beginPath();G.ellipse(x+w*.5,y+h*.42,w*.13,h*.22,0,0,7);G.fill();
  G.fillStyle="#2a1a10";G.beginPath();G.ellipse(x+w*.5,y+h*.28,w*.14,h*.1,0,Math.PI,0);G.fill();
  G.fillStyle="#0a0a0c";G.fillRect(x+w*.44,y+h*.4,w*.025,h*.04);G.fillRect(x+w*.535,y+h*.4,w*.025,h*.04);
  G.fillStyle="#f0b429";G.beginPath();G.arc(x+w*.82,y+h*.2,h*.07,0,7);G.fill();
  G.restore()}
window.dzFrame=function(sec){
  var t=sec%4,k=io(seg(t,.3,1))*(1-io(seg(t,3.3,3.9))),net=io(seg(t,1,2))*(1-io(seg(t,3.3,3.6)));
  g.fillStyle="#0a0a0c";g.fillRect(0,0,480,270);
  var w=160+k*192,h=w*9/16,x=240-w/2,y=128-h/2;
  portrait(gp,0,0,40,23,t);
  g.imageSmoothingEnabled=!1;g.drawImage(p,x,y,w,h);
  if(net>0){g.save();g.beginPath();g.rect(x,y,w,h*net);g.clip();portrait(g,x,y,w,h,t);g.restore();
    if(net<1){g.fillStyle="#f0b429";g.fillRect(x,y+h*net-1,w,2)}}
  g.strokeStyle="#f0b429";g.lineWidth=3;var L=16;
  [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(function(q){g.beginPath();g.moveTo(q[0],q[1]+q[3]*L);
    g.lineTo(q[0],q[1]);g.lineTo(q[0]+q[2]*L,q[1]);g.stroke()});
  g.fillStyle="#f0b429";g.fillRect(0,266,480*(t/4),4)};
window.dzFrame(0);
</script></body></html>
