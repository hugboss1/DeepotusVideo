<!doctype html>
<html><head><meta charset="utf-8">
<meta name="dz-geste" content="recadrer">
<meta name="dz-skill" content="style-photos">
<meta name="dz-format" content="480x270">
<meta name="dz-affiche" content="2.4">
<style>html,body{margin:0;background:#0a0a0c}canvas{display:block}</style>
</head><body><canvas id="c" width="480" height="270"></canvas>
<script>
/* t275 · Changer le format (16:9 → 9:16). Fiche maison style-photos : un glissement, jamais un effet tape-à-l'œil.
   Le cadre large se resserre en cadre vertical ; l'image garde sa largeur et l'IA complète le haut (ciel) et le bas
   (sol) par bandes, au lieu de bandes noires. */
var c=document.getElementById("c"),g=c.getContext("2d");
function cl(v){return v<0?0:v>1?1:v}
function io(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function seg(t,a,b){return cl((t-a)/(b-a))}
function lerp(a,b,k){return a+(b-a)*k}
function image(x,y,w,h,t){
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  g.fillStyle="#6fa0f0";g.fillRect(x,y,w,h);
  g.fillStyle="#2b4f86";g.beginPath();g.moveTo(x,y+h*.75);g.lineTo(x+w*.3,y+h*.4);g.lineTo(x+w*.55,y+h*.62);
  g.lineTo(x+w*.8,y+h*.35);g.lineTo(x+w,y+h*.6);g.lineTo(x+w,y+h);g.lineTo(x,y+h);g.fill();
  g.fillStyle="#f0b429";g.beginPath();g.arc(x+w*.5,y+h*.6+Math.sin(t*3)*h*.04,h*.12,0,7);g.fill();
  g.restore()}
function ciel(x,y,w,h){g.fillStyle="#9cc0f5";g.fillRect(x,y,w,h);g.fillStyle="#f2efe9";g.globalAlpha=.8;
  g.beginPath();g.ellipse(x+w*.35,y+h*.5,w*.2,h*.12,0,0,7);g.ellipse(x+w*.6,y+h*.45,w*.16,h*.1,0,0,7);g.fill();g.globalAlpha=1}
function sol(x,y,w,h){g.fillStyle="#2b4f86";g.fillRect(x,y,w,h);g.fillStyle="#1c2a44";
  for(var i=0;i<4;i++)g.fillRect(x+w*(.1+i*.22),y+h*(.3+(i%2)*.25),w*.12,h*.12)}
window.dzFrame=function(sec){
  var t=sec%4,k=io(seg(t,.4,1.3))*(1-io(seg(t,3.2,3.9)));
  g.fillStyle="#0a0a0c";g.fillRect(0,0,480,270);
  var W0=320,H0=180,W1=136,H1=242;
  var w=lerp(W0,W1,k),h=lerp(H0,H1,k),x=240-w/2,y=135-h/2;
  var ih=w*9/16,iy=135-ih/2;
  var rempl=seg(t,1.3,2.1)*(1-io(seg(t,3.2,3.6)));
  g.fillStyle="#151519";g.fillRect(x,y,w,h);
  if(k>.02&&rempl>0){var hz=iy-y;
    for(var b=0;b<5;b++){var q=io(cl(rempl*1.8-b*.18));if(q<=0)continue;
      g.save();g.beginPath();g.rect(x,iy-hz*(b+1)/5,w*q,hz/5+.5);g.clip();ciel(x,y,w,hz);g.restore();
      g.save();g.beginPath();g.rect(x+w*(1-q),iy+ih+hz*b/5,w*q,hz/5+.5);g.clip();sol(x,iy+ih,w,hz);g.restore()}}
  image(x,iy,w,ih,t);
  g.strokeStyle="#f0b429";g.lineWidth=2;g.strokeRect(x,y,w,h);
  g.fillStyle="#8a857d";g.fillRect(40,232,40*(1-k)+14*k,22*(1-k)+30*k);
  g.fillStyle="#f0b429";g.fillRect(0,266,480*(t/4),4)};
window.dzFrame(0);
</script></body></html>
