<!doctype html>
<html><head><meta charset="utf-8">
<meta name="dz-geste" content="retoucher-kling">
<meta name="dz-skill" content="style-shapes">
<meta name="dz-format" content="480x270">
<meta name="dz-affiche" content="2.2">
<style>html,body{margin:0;background:#0a0a0c}canvas{display:block}</style>
</head><body><canvas id="c" width="480" height="270"></canvas>
<script>
/* t275 · Modifier par une phrase (Kling O3). Fiche maison style-shapes : une phrase s'écrit (barres, aucun mot), puis
   l'élément visé change de forme et de couleur avec un dépassement ; le personnage continue de sauter et l'onde du son
   continue de battre : le mouvement et le son restent. */
var c=document.getElementById("c"),g=c.getContext("2d");
function cl(v){return v<0?0:v>1?1:v}
function io(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function ob(t){var s=1.70158;t-=1;return 1+(s+1)*t*t*t+s*t*t}
function seg(t,a,b){return cl((t-a)/(b-a))}
window.dzFrame=function(sec){
  var t=sec%4;
  g.fillStyle="#151519";g.fillRect(0,0,480,270);
  g.fillStyle="#1c1c21";g.fillRect(0,200,480,70);
  var saut=Math.abs(Math.sin(t*Math.PI*1.5))*46,x=150,y=200-saut;
  g.fillStyle="#0f0f12";g.beginPath();g.ellipse(x,202,26-saut*.2,5,0,0,7);g.fill();
  var m=ob(seg(t,1.4,2))*(1-io(seg(t,3.3,3.9)));
  g.fillStyle="#6fa0f0";g.fillRect(x-22,y-60,44,60);
  g.fillStyle="#f2efe9";g.fillRect(x-12,y-48,7,7);g.fillRect(x+5,y-48,7,7);
  var hx=x,hy=y-60;
  if(m<.5){var k=1-m*2;g.fillStyle="#3a3a42";g.fillRect(hx-18*k,hy-12*k,36*k,12*k)}
  else{var k2=(m-.5)*2;g.fillStyle="#f0b429";g.beginPath();g.moveTo(hx-24*k2,hy);g.lineTo(hx-16*k2,hy-30*k2);
    g.lineTo(hx-4*k2,hy-14*k2);g.lineTo(hx,hy-34*k2);g.lineTo(hx+4*k2,hy-14*k2);g.lineTo(hx+16*k2,hy-30*k2);
    g.lineTo(hx+24*k2,hy);g.fill()}
  var etin=seg(t,1.35,1.9);
  if(etin>0&&etin<1){for(var i=0;i<10;i++){var a=i/10*Math.PI*2,r=10+etin*48;g.fillStyle="#f0b429";g.globalAlpha=1-etin;
    g.fillRect(hx+Math.cos(a)*r-2,hy-14+Math.sin(a)*r-2,4,4)}g.globalAlpha=1}
  g.fillStyle="#1c1c21";g.fillRect(270,40,180,74);g.strokeStyle="#f0b429";g.lineWidth=1;g.strokeRect(270.5,40.5,179,73);
  g.fillStyle="#1c1c21";g.beginPath();g.moveTo(290,114);g.lineTo(300,130);g.lineTo(312,114);g.fill();
  var ecr=seg(t,.2,1.3)*(1-io(seg(t,3.3,3.8))),L=[150,120,90];
  for(var j=0;j<3;j++){var w=cl(ecr*3-j)*L[j];g.fillStyle=j===1?"#f0b429":"#8a857d";g.fillRect(286,56+j*16,w,6)}
  if(ecr>0&&ecr<1&&Math.floor(t*4)%2===0){var jj=Math.min(2,Math.floor(ecr*3));g.fillStyle="#f2efe9";
    g.fillRect(286+cl(ecr*3-jj)*L[jj]+3,53+jj*16,2,12)}
  for(var b=0;b<24;b++){var hb=6+Math.abs(Math.sin(t*7+b*.7))*22*(.5+.5*Math.sin(b*.4));
    g.fillStyle="#6fa0f0";g.globalAlpha=.7;g.fillRect(270+b*7.5,218-hb/2+10,4,hb)}g.globalAlpha=1;
  g.fillStyle="#f0b429";g.fillRect(0,266,480*(t/4),4)};
window.dzFrame(0);
</script></body></html>
