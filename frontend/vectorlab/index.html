<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <title>Vectorlab — Deepotus Video Gen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="vectorlab.css"/>
</head>
<body>
  <header class="bar">
    <div class="brand">◧ Vectorlab</div>
    <div class="doc"><b id="docTitle">…</b> <span id="docMeta"></span></div>
    <span id="temoin" title="État d'enregistrement">✓</span>
    <div class="spacer"></div>
    <span id="zoomLabel" title="Molette : zoom · glisser (main ou fond) : déplacer">100 %</span>
    <button id="btnGrille" title="Grille d'aimantation (G)">⌗ 8</button>
    <button id="btnAnnuler" title="Annuler (Ctrl+Z)">↶</button>
    <button id="btnRefaire" title="Refaire (Ctrl+Y)">↷</button>
    <button id="btnSauver" class="primaire" title="Sauver (Ctrl+S)">Sauver</button>
  </header>
  <div class="rangee">
    <nav id="outils" class="outils">
      <button data-outil="select" class="actif" title="Sélection — déplacer, lasso, poignées (V)">▢</button>
      <button data-outil="plume" title="Plume Bézier — clic = ancre, glisser = poignées, double-clic = finir, clic sur la première ancre = fermer (P)">✒</button>
      <button data-outil="rect" title="Rectangle — Maj = carré (R)">▭</button>
      <button data-outil="ellipse" title="Ellipse — Maj = cercle (E)">◯</button>
      <button data-outil="noeuds" title="Nœuds — glisser une ancre, double-clic = angle↔courbe, Suppr = retirer (N)">✜</button>
      <button data-outil="pipette" title="Pipette — adopte le style de l'objet cliqué et l'applique à la sélection (I)">💧</button>
      <button data-outil="texte" title="Texte — clic pour poser, double-clic (outil sélection) pour rééditer (T)">Ａ</button>
    </nav>
    <div class="scene">
      <canvas id="regleH" class="regle regle-h" height="24"></canvas>
      <div class="scene-basse">
        <canvas id="regleV" class="regle regle-v" width="24"></canvas>
        <main id="stage">
          <div id="canvasHost"></div>
          <svg id="overlay"></svg>
        </main>
      </div>
    </div>
    <aside id="panneauCalques" class="panneau">
      <div class="panneau-tete">Apparence</div>
      <div id="panneauStyle"></div>
      <div class="panneau-tete">Calques
        <button id="btnCalquePlus" title="Nouveau calque">＋</button>
      </div>
      <div id="listeCalques"></div>
    </aside>
  </div>
  <script src="vendor/martinez.umd.js"></script>
  <script type="module" src="js/core.js"></script>
</body>
</html>
