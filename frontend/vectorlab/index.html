<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <title>Vectorlab — Deepotus Video Gen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="vectorlab.css"/>
</head>
<body>
  <header class="bar">
    <div class="brand">◧ Vectorlab</div>
    <button id="btnBiblio" title="Bibliothèque des documents">⌂</button>
    <div class="doc"><b id="docTitle">…</b> <span id="docMeta"></span></div>
    <span id="temoin" title="État d'enregistrement">✓</span>
    <div class="spacer"></div>
    <span id="zoomLabel" title="Molette : zoom · glisser (main ou fond) : déplacer">100 %</span>
    <button id="btnUnite" title="Unité d'affichage des règles et des cotes (px → mm → cm → in) — sauvée avec le document, le dpi du document fait le pont physique">px</button>
    <button id="btnGrille" title="Grille d'aimantation (G)">⌗ 8</button>
    <button id="btnAnnuler" title="Annuler (Ctrl+Z)">↶</button>
    <button id="btnRefaire" title="Refaire (Ctrl+Y)">↷</button>
    <span class="exp-conteneur">
      <button id="btnExporter" title="Exporter le document">Exporter ▾</button>
      <div id="expMenu" class="exp-menu hidden">
        <button id="expSvg" title="Compile ici, stocké au serveur, servi sur export.svg">SVG (serveur)</button>
        <button id="expPng1" title="PNG taille du document → Library">PNG 1×</button>
        <button id="expPng2" title="PNG double → Library">PNG 2×</button>
        <button id="expPng4" title="PNG quadruple → Library">PNG 4×</button>
        <label title="Compile sans le fond du document — coché d'office pour un calque de lumière"><input type="checkbox" id="expTransparent"/> fond transparent</label>
        <button id="expBible" title="Exporte en 2× et l'ajoute aux images d'inspiration d'une entité de la bible — les planches s'y conditionnent ensuite (machinerie existante, tir opt-in)">→ Bible…</button>
      </div>
    </span>
    <button id="btnSauver" class="primaire" title="Sauver (Ctrl+S)">Sauver</button>
  </header>
  <section id="biblio" class="biblio">
    <div class="bib-outils">
      <input id="bibNouvNom" type="text" placeholder="nom du nouveau document"/>
      <select id="bibNouvRole" title="Rôle du nouveau document">
        <option value="libre">libre</option>
        <option value="decor">décor</option>
        <option value="lumiere">lumière</option>
        <option value="personnage">personnage</option>
      </select>
      <select id="bibNouvFormat" title="Format du document — les formats physiques posent l'unité mm à 300 dpi"></select>
      <input id="bibNouvTaille" type="text" value="640×960" title="Taille du document en px (L×H) — éditable en format Libre"/>
      <button id="bibCreer" class="primaire" title="Crée le document et l'ouvre dans l'éditeur">＋ Créer</button>
      <span class="spacer"></span>
      <input id="bibRecherche" type="search" placeholder="rechercher par nom…"/>
      <select id="bibRole" title="Filtrer par rôle">
        <option value="">tous les rôles</option>
        <option value="decor">décor</option>
        <option value="lumiere">lumière</option>
        <option value="personnage">personnage</option>
        <option value="libre">libre</option>
      </select>
    </div>
    <div id="bibListe" class="bib-liste"></div>
  </section>
  <div class="rangee">
    <nav id="outils" class="outils">
      <button data-outil="select" class="actif" title="Sélection — déplacer, lasso, poignées (V)">▢</button>
      <button data-outil="plume" title="Plume Bézier — clic = ancre, glisser = poignées, double-clic = finir, clic sur la première ancre = fermer (P)">✒</button>
      <button data-outil="rect" title="Rectangle — Maj = carré (R)">▭</button>
      <button data-outil="ellipse" title="Ellipse — Maj = cercle (E)">◯</button>
      <button data-outil="ligne" title="Ligne — glisser pour tracer un segment, Maj = angles 45° (L)">╱</button>
      <button data-outil="noeuds" title="Nœuds — glisser une ancre, double-clic = angle↔courbe, Suppr = retirer (N)">✜</button>
      <button data-outil="mesure" title="Mesure — glisser pour lire longueur, angle et Δ sans rien créer (M)">⤢</button>
      <button data-outil="pipette" title="Pipette — adopte le style de l'objet cliqué et l'applique à la sélection (I)">💧</button>
      <button data-outil="texte" title="Texte — clic pour poser, double-clic (outil sélection) pour rééditer (T)">Ａ</button>
    </nav>
    <div class="scene">
      <canvas id="regleH" class="regle regle-h" height="24"></canvas>
      <div class="scene-basse">
        <canvas id="regleV" class="regle regle-v" width="24"></canvas>
        <main id="stage">
          <div id="canvasHost"></div>
          <svg id="overlay"></svg>
        </main>
      </div>
    </div>
    <aside id="panneauCalques" class="panneau">
      <div class="panneau-tete">Vitrail</div>
      <div id="panneauVitrail"></div>
      <div class="panneau-tete">Apparence</div>
      <div id="panneauStyle"></div>
      <div class="panneau-tete">Calques
        <button id="btnCalquePlus" title="Nouveau calque">＋</button>
      </div>
      <div id="listeCalques"></div>
    </aside>
  </div>
  <script src="vendor/martinez.umd.js"></script>
  <script type="module" src="js/core.js"></script>
</body>
</html>
