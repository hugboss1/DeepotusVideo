<script src="/shared/icons/dz-icons.js"></script>
<!-- Carte EN LIGNE, et non <script type="importmap" src="…"> : les import maps
     externes ne sont supportées par aucun navigateur — mesuré, la page reste
     inerte avec « Failed to resolve module specifier "three" ». La référence du
     dossier vendorisé reste /assets/three/importmap.json ; un banc de
     test_etabli_canevas.py interdit que les deux divergent. -->
<script type="importmap">
{
  "imports": {
    "three": "/assets/three/three.module.min.js",
    "three/addons/": "/assets/three/addons/"
  }
}
</script>

<body>
<div class="etabli" id="etabli">

  <!-- ══════════ gauche : la vie du modèle ══════════ -->
  <aside class="rail-left">
    <div class="dt-label">La vie du modèle</div>
    <div class="chrono" id="chrono">
      <div class="chrono-vide">chargement…</div>
    </div>
    <div class="chrono-aide">
      clic : charger · <b>alt-clic</b> : comparer
    </div>
  </aside>

  <!-- ══════════ centre : le grand canevas ══════════ -->
  <main class="centre">
    <header class="head">
      <!-- La sortie de l'écran, et elle est à GAUCHE, avant le titre : cette
           page remplace le graphe DANS l'iframe du hub, elle doit donc rendre
           la main là où on cherche un retour. `.head-right` porte les
           contrôles de la VUE — « Sur la plaque » et « A/B ✕ » ; y poser une
           navigation ferait du bouton qui QUITTE la page le voisin de celui
           qui ferme un panneau.
           `head-btn` sur les QUATRE boutons de l'en-tête : c'est la classe qui
           les rend identiques, jamais leur `id` — voir etabli.css. Un banc
           compare le nombre de `<button>` de l'en-tête à celui des porteurs
           de la classe, pour qu'un quatrième ne naisse pas nu. -->
      <button class="head-btn" id="btnRetour" title="Revenir au graphe du 3D Studio"><svg class="dzi dzi--16" aria-hidden="true" focusable="false"><use href="/shared/icons/dz-icons.svg#dz-action-retour"></use></svg> 3D Studio</button>
      <span class="head-title">Établi</span>
      <span class="head-chip" id="chipSource">—</span>
      <div class="head-right">
        <!-- La bascule « Assemblé / Sur la plaque » est un contrôle de la VUE :
             sa place est ici, à côté de « A/B ✕ », et non près du bouton qui
             quitte la page. Elle porte `head-btn` comme ses deux voisins —
             c'est cette classe, jamais un `id`, qui fait des boutons de
             l'en-tête le MÊME bouton (voir etabli.css).

             ET ELLE NAÎT SANS TEXTE, délibérément : son libellé et son
             infobulle changent avec l'état, et majBoutonPlaque() les écrit
             dès l'import du module — comme #panParties naît vide et se
             remplit au même moment. Les écrire ICI aussi ferait deux sources
             pour un seul texte, qui divergeraient à la première retouche. -->
        <button class="head-btn" id="btnAide" title="Le pas à pas et le lexique, sans quitter l'écran — et le chapitre 21 du guide"><svg class="dzi dzi--16" aria-hidden="true" focusable="false"><use href="/shared/icons/dz-icons.svg#dz-action-aide"></use></svg> Aide</button>
        <button class="head-btn" id="btnPlaque"></button>
        <button class="head-btn" id="btnCompare" title="Fermer la comparaison"><svg class="dzi dzi--16" aria-hidden="true" focusable="false"><use href="/shared/icons/dz-icons.svg#dz-action-fermer"></use></svg> A/B</button>
      </div>
    </header>

    <div class="vues" id="vues">
      <!-- LE POINT DE VUE VIT DANS LE CANEVAS, et non dans l'en-tête. Deux
           raisons, et la seconde est mécanique.
           1. C'est un réglage de l'OUTIL de regard, pas de la page : la main
              est déjà sur le canevas quand on veut redresser la vue, et
              l'en-tête porte les trois gestes qui changent ce qu'on REGARDE
              (quitter, étaler, comparer), pas la façon de le regarder.
           2. Un banc compare le nombre de `<button>` de l'en-tête à celui des
              porteurs de `head-btn`, et un autre fixe ce nombre à trois.
              Poser quatre boutons de plus là-haut aurait fait bouger deux
              comptes rigides pour un contrôle qui n'appartient pas au bandeau.
              Ils portent donc `cam-btn`, jamais `head-btn` — voir etabli.css.
           #btnProjection NAÎT SANS TEXTE, comme #btnPlaque : son libellé porte
           la DESTINATION et change avec l'état, et majBoutonProjection()
           l'écrit dès l'import du module. L'écrire ici aussi ferait deux
           sources pour un seul texte. Les trois autres sont fixes, eux, et se
           lisent donc dans le balisage. -->
      <div class="vue" id="vueA"><canvas></canvas><span class="vue-tag">A</span>
        <div class="vue-cam" id="vueCam">
          <button class="cam-btn" id="btnProjection"></button>
          <button class="cam-btn" data-vue="face">Face</button>
          <button class="cam-btn" data-vue="dessus">Dessus</button>
          <button class="cam-btn" data-vue="profil">Profil</button>
        </div>
        <!-- LES OUTILS QUI ÉCRIVENT (lot B) — « poser sur une face » et le
             couteau — posés SUR le canevas comme le point de vue, et pour la
             même raison : la main est déjà là. En BAS à gauche, loin de
             `.vue-cam` (haut droit) et de l'étiquette « A » (haut gauche).
             Ils portent `outil-btn`, ni la classe des boutons de l'en-tête ni
             celle du point de vue : deux comptes rigides tiennent ces deux
             familles, et un outil n'est ni l'une ni l'autre.
             #btnAssise, #btnCouteau et #btnCouteauManip NAISSENT SANS TEXTE :
             leur libellé porte l'état du geste, et majOutils() l'écrit dès
             l'import du module — une seule source. La barre du couteau naît
             cachée : elle n'a de sens qu'un plan de coupe posé. -->
        <div class="vue-outils" id="vueOutils">
          <button class="outil-btn" id="btnAssise"></button>
          <button class="outil-btn" id="btnOrienter"></button>
          <button class="outil-btn" id="btnCouteau"></button>
          <button class="outil-btn" id="btnMesure"></button>
          <button class="outil-btn" id="btnArranger"></button>
          <button class="outil-btn" id="btnSurplombs"></button>
          <button class="outil-btn" id="btnTranches"></button>
          <span class="outil-couteau hidden" id="couteauBarre">
            <button class="outil-btn" id="btnCouteauManip"></button>
            <select class="outil-sel" id="couteauGarder"
                    title="le côté a est celui que montre la flèche du plan">
              <option value="deux">garder les deux côtés</option>
              <option value="a">garder le côté a (flèche)</option>
              <option value="b">garder le côté b</option>
            </select>
            <select class="outil-sel" id="couteauConnecteur"
                    title="posé APRÈS la coupe, sur les deux moitiés que le couteau vient d'écrire (une version de plus)">
              <option value="">sans connecteur</option>
              <option value="teton">téton</option>
              <option value="cheville">cheville</option>
              <option value="aronde">queue d'aronde</option>
            </select>
            <button class="outil-btn outil-couper" id="btnCouper"
                    title="Python coupe et écrit une version de plus — refusé tant que des modifications attendent">Couper</button>
          </span>
        </div>
      </div>
      <div class="vue hidden" id="vueB"><canvas></canvas><span class="vue-tag">B</span></div>
    </div>

    <div class="ecart hidden" id="ecart"></div>

    <footer class="barre" id="barre">
      <span id="barreFichier">aucun modèle chargé</span>
      <span id="barreGeo">—</span>
      <span class="barre-attente" id="barreAttente"></span>
    </footer>
  </main>

  <!-- ══════════ droite : les onglets ══════════ -->
  <aside class="rail-right">
    <div class="onglets">
      <button class="on actif" data-onglet="parties">Parties</button>
      <button class="on" data-onglet="rig">Rig</button>
      <button class="on" data-onglet="fiche">Fiche</button>
      <button class="on" data-onglet="export">Export</button>
    </div>
    <div class="panneau" id="panParties"></div>
    <div class="panneau hidden" id="panRig">
      <div class="vide">aucun modèle chargé</div>
    </div>
    <div class="panneau hidden" id="panFiche"></div>
    <div class="panneau hidden" id="panExport">
      <div class="dt-label">Impression 3D</div>
      <button id="btnImprimer" title="Exporte la version AFFICHÉE en STL + 3MF aux millimètres de la taille cible (dossier sous assets/print3d)"><svg class="dzi dzi--16" aria-hidden="true" focusable="false"><use href="/shared/icons/dz-icons.svg#dz-lab3d-impression-3d"></use></svg> Impression 3D</button>
      <button id="btnSlicer" title="Ouvre le .3mf du dernier export dans le slicer (ElegooSlicer ou OrcaSlicer)"><svg class="dzi dzi--16" aria-hidden="true" focusable="false"><use href="/shared/icons/dz-icons.svg#dz-lab3d-impression-3d"></use></svg> Ouvrir dans le slicer</button>
      <!-- les moteurs de jeu (T093) : rendus par rendreExportMoteurs(), nés vides -->
      <div class="moteurs" id="panMoteurs"></div>
      <!-- l'aller-retour Blender (T094) : le GLB corrigé revient comme une version DE PLUS -->
      <div class="dt-label">Retour de Blender</div>
      <input id="retourFichier" type="file" accept=".glb,model/gltf-binary" hidden>
      <button id="btnRetourBlender" title="Importe un GLB corrigé (dans Blender ou ailleurs) comme une version de PLUS du job affiché : rien n'est écrasé, et ce qui s'est perdu en route (squelette, clips, matériaux) est dit"><svg class="dzi dzi--16" aria-hidden="true" focusable="false"><use href="/shared/icons/dz-icons.svg#dz-action-importer"></use></svg> Importer une version corrigée…</button>
    </div>

    <!-- ══ le repère : HORS des onglets, et c'est la décision ══
         La graduation appartient à la VUE, pas à un onglet : un cinquième
         panneau l'aurait rendue invisible neuf fois sur dix, au moment même
         où l'on coche des pièces dans « Parties » pour lire où elles sont.
         Elle vit donc SOUS les panneaux, toujours affichée — comme la barre du
         bas l'est pour la mesure du modèle.
         Et le bloc naît VIDE, comme #panParties et #panFiche : rendreRepere()
         l'écrit dès l'import du module, deux sources pour un même balisage
         divergeant à la première retouche. -->
    <div class="repere" id="repere"></div>
    <!-- l'aide contextuelle (T091) : née cachée, écrite par ouvrirAide() à l'ouverture -->
    <div class="aide hidden" id="panAide"></div>
    <!-- l'imprimante active (tâche #88) : rendue par rendreImprimante(), née vide -->
    <div class="imprimante" id="imprimante"></div>
  </aside>
</div>
<script src="/shared/dz-plafonds.js"></script>
<script src="/shared/dialogue.js"></script>
<script type="module" src="etabli.js"></script>
</body>
</html>
