<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photolab</title>
<!-- Internationalisation : dictionnaire puis runtime, AVANT tout autre script (banc test_i18n_l0.py). -->
<script src="/shared/dz-i18n-dico.js"></script>
<script src="/shared/dz-i18n.js"></script>
<script src="/shared/dz-plafonds.js"></script>
<script src="/shared/dialogue.js"></script>
<link rel="stylesheet" href="photolab.css">
</head>
<body>
  <!-- Disposition de photocraft (inventaire A1) : menus 32, options 36, onglets de documents 26,
       barre d'outils 68, scène, rail d'icônes 34, colonne de panneaux 278, barre d'état 24. -->
  <nav id="menubar" role="menubar" aria-label="Menus"></nav>
  <div id="options" role="toolbar" aria-label="Options de l'outil"></div>
  <div id="onglets" role="tablist" aria-label="Documents"></div>

  <div id="corps">
    <aside id="outils" aria-label="Outils"></aside>

    <main id="scene">
      <canvas id="toile"></canvas>
      <svg id="fourmis" aria-hidden="true"></svg>
      <div id="accueil">
        <h1>Photolab</h1>
        <p>Crée un document ou ouvre une image.</p>
        <div class="accueil-boutons">
          <button id="btnNouveau" class="btn plein" type="button">Nouveau…<kbd>Ctrl+N</kbd></button>
          <button id="btnOuvrir" class="btn contour" type="button">Ouvrir depuis la Bibliothèque…<kbd>Ctrl+O</kbd></button>
        </div>
        <p class="depot">Dépose une image ici pour l'ouvrir.</p>
      </div>
    </main>

    <nav id="rail" aria-label="Panneaux">
      <button type="button" data-panneau="reglages" data-icone="sliders" title="Ajustements" aria-label="Ajustements"></button>
      <button type="button" data-panneau="navigateur" data-icone="compass" title="Navigateur" aria-label="Navigateur"></button>
      <button type="button" data-panneau="couleur" data-icone="palette" title="Couleur" aria-label="Couleur"></button>
      <button type="button" data-panneau="calques" data-icone="layers" title="Calques" aria-label="Calques"></button>
      <button type="button" data-panneau="historique" data-icone="history" title="Historique" aria-label="Historique"></button>
      <button type="button" data-panneau="pinceaux" data-icone="brush" title="Pinceaux" aria-label="Pinceaux"></button>
    </nav>

    <aside id="panneaux" aria-label="Panneaux">
      <section id="grpCouleur" class="groupe">
        <header class="groupe-tete"><span class="groupe-titre">Couleur</span></header>
        <div class="groupe-corps" id="corpsCouleur"></div>
      </section>
      <!-- t138 B5 : Propriétés | Ajustements dans le MÊME groupe (photocraft : onglet Adjustments à côté de Properties). -->
      <section id="grpProprietes" class="groupe">
        <header class="groupe-tete" role="tablist">
          <button type="button" class="onglet actif" role="tab" data-onglet-pr="proprietes" aria-selected="true">Propriétés</button>
          <button type="button" class="onglet" role="tab" data-onglet-pr="ajustements" aria-selected="false">Ajustements</button>
        </header>
        <div class="groupe-corps" id="corpsProprietes" data-vue-pr="proprietes"></div>
        <div class="groupe-corps" id="corpsAjustements" data-vue-pr="ajustements" hidden></div>
      </section>
      <!-- t155 : outils de peinture (Fenêtre › Pinceaux, Paramètres du pinceau F5, Source de duplication, Outils prédéfinis) ;
           replié tant qu'on ne l'ouvre pas (rail ou menu). -->
      <section id="grpPinceaux" class="groupe" hidden>
        <header class="groupe-tete" role="tablist">
          <button type="button" class="onglet actif" role="tab" data-onglet-pi="pinceaux" aria-selected="true">Pinceaux</button>
          <button type="button" class="onglet" role="tab" data-onglet-pi="parametres" aria-selected="false">Paramètres de pinceau</button>
          <button type="button" class="onglet" role="tab" data-onglet-pi="source" aria-selected="false">Source de duplication</button>
          <button type="button" class="onglet" role="tab" data-onglet-pi="predefinis" aria-selected="false">Outils prédéfinis</button>
        </header>
        <div class="groupe-corps" id="corpsPinceaux" data-vue-pi="pinceaux"></div>
        <div class="groupe-corps" id="corpsParametresPinceau" data-vue-pi="parametres" hidden></div>
        <div class="groupe-corps" id="corpsSourceDuplication" data-vue-pi="source" hidden></div>
        <div class="groupe-corps" id="corpsOutilsPredefinis" data-vue-pi="predefinis" hidden></div>
      </section>
      <section id="grpCalques" class="groupe grand">
        <header class="groupe-tete" role="tablist">
          <button type="button" class="onglet actif" role="tab" data-onglet="calques">Calques</button>
          <button type="button" class="onglet" role="tab" data-onglet="historique">Historique</button>
          <button type="button" class="onglet" role="tab" data-onglet="navigateur">Navigateur</button>
        </header>
        <div class="groupe-corps" id="corpsCalques" data-vue="calques"></div>
        <div class="groupe-corps" id="corpsHistorique" data-vue="historique" hidden></div>
        <div class="groupe-corps" id="corpsNavigateur" data-vue="navigateur" hidden></div>
      </section>
    </aside>
  </div>

  <footer id="statut" role="status">
    <span id="stZoom" class="st-zoom">100 %</span>
    <span id="stMode" class="st-mode">RGB · 8 bits</span>
    <span id="stTaille" class="st-taille"></span>
    <span id="stCalques" class="st-calques"></span>
    <span id="stSelection" class="st-selection"></span>
    <span id="stMessage" class="st-message"></span>
  </footer>

  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/core.js"></script>
  <script type="module">import { initDidact } from "/vectorlab/js/mod-didact.js"; initDidact({}, { aide: "aide/", racine: "body" });   /* t140 : fiches didactiques (aide/index.json), survol long ou « ? » */</script>
</body>
</html>
